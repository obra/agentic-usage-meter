appId: com.fsck.agentic-usage-meter.desktop
productName: Agentic Usage Meter
copyright: MIT

files:
  - out/**
  - resources/**
  - package.json

directories:
  output: dist

asar: true

# Windows: NSIS installer + portable zip. Icon is generated by
# scripts/generate-icons.mjs (resources/icon.png, 1024x1024);
# electron-builder converts it to .ico during packaging.
win:
  target:
    - nsis
    - zip
  icon: resources/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Agentic Usage Meter
  artifactName: ${productName} Setup ${version}-${arch}.${ext}

mac:
  target:
    - dmg
    - zip
  icon: resources/icon.png
  category: public.app-category.utilities

linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Utility
