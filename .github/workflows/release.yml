name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_ID_APPLICATION: "Developer ID Application: Jesse Vincent (87WJ58S66M)"
      NOTARYTOOL_PROFILE: ci-notary
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore the exact release remote and tag state
        run: |
          git remote set-url origin \
            https://github.com/prime-radiant-inc/agentic-usage-meter.git
          git fetch --tags --force
          git checkout "${GITHUB_REF_NAME}"

      - name: Create the release keychain
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_password=$(uuidgen)
          echo "::add-mask::${keychain_password}"
          keychain_path="${RUNNER_TEMP}/release.keychain-db"
          security create-keychain -p "${keychain_password}" \
            "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" \
            ~/Library/Keychains/login.keychain-db
          security default-keychain -s "${keychain_path}"
          printf '%s' "${DEVELOPER_ID_CERT_P12}" \
            | base64 --decode > "${RUNNER_TEMP}/developer-id.p12"
          security import "${RUNNER_TEMP}/developer-id.p12" \
            -k "${keychain_path}" \
            -P "${DEVELOPER_ID_CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${RUNNER_TEMP}/developer-id.p12"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}" \
            > /dev/null
          echo "RELEASE_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Store the notarization profile
        env:
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "${NOTARY_API_KEY_P8}" \
            > "${RUNNER_TEMP}/notary-key.p8"
          # Individual App Store Connect API keys have no issuer ID.
          if [[ -n "${NOTARY_API_ISSUER_ID}" ]]; then
            xcrun notarytool store-credentials "${NOTARYTOOL_PROFILE}" \
              --key "${RUNNER_TEMP}/notary-key.p8" \
              --key-id "${NOTARY_API_KEY_ID}" \
              --issuer "${NOTARY_API_ISSUER_ID}"
          else
            # Individual keys make store-credentials prompt for the
            # issuer; an empty stdin line answers "no issuer".
            printf '\n' | xcrun notarytool store-credentials \
              "${NOTARYTOOL_PROFILE}" \
              --key "${RUNNER_TEMP}/notary-key.p8" \
              --key-id "${NOTARY_API_KEY_ID}"
          fi
          rm -f "${RUNNER_TEMP}/notary-key.p8"

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-release-${{ runner.os }}-

      - name: Fetch Sparkle tools
        run: swift build -c release

      - name: Run the release
        env:
          # Passed through to generate_appcast on stdin; a key imported
          # into a keychain hangs headless runs on an access prompt.
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: Scripts/release.sh "${GITHUB_REF_NAME}"

      - name: Preserve release outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: build/releases/
          if-no-files-found: ignore

      - name: Destroy the release keychain
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "${RELEASE_KEYCHAIN}" || true
          fi
