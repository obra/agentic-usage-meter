<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Agentic Usage Meter Settings</title>
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <div class="scroll">
      <header class="page-header">
        <h1>Settings</h1>
      </header>

      <section class="section">
        <h2 class="section-title">Connected accounts</h2>
        <div id="accounts" class="accounts"></div>
      </section>

      <section class="section">
        <h2 class="section-title">Add account</h2>
        <div id="providers" class="provider-grid"></div>
      </section>

      <footer class="privacy-note">
        Requests go directly from this computer to each provider. Credentials are
        stored encrypted by the operating system. The app has no analytics or
        telemetry.
      </footer>
    </div>

    <div id="modal-backdrop" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <div id="connect-form" class="modal-body"></div>
        <div id="connect-progress" class="modal-body" hidden></div>
      </div>
    </div>
    <script type="module" src="./settings.js"></script>
  </body>
</html>
